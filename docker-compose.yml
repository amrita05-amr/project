version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eams_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eams_user
      POSTGRES_PASSWORD: eams_password
      POSTGRES_DB: eams_db
    ports:
      - "5432:5432"
    volumes:
      - eams_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eams_user -d eams_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eams_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - eams_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  eams_postgres_data:
  eams_redis_data:
